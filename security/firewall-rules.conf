# EVILCORP Firewall Rules - CLUSTER-01
# Last reviewed: 2026-04-05

# Allow internal traffic
-A INPUT -s 10.0.0.0/16 -j ACCEPT

# Allow HTTPS
-A INPUT -p tcp --dport 443 -j ACCEPT
-A INPUT -p tcp --dport 8443 -j ACCEPT

# Allow monitoring
-A INPUT -p tcp --dport 9090 -s 10.0.1.0/24 -j ACCEPT

# Block external SSH (use bastion only)
-A INPUT -p tcp --dport 22 -s 0.0.0.0/0 -j DROP

# Drop everything else
-A INPUT -j DROP
