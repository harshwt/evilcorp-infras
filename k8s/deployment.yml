apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: evilcorp-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api
          image: evilcorp/api-gateway:2.7.1
          ports:
            - containerPort: 8443
          resources:
            limits:
              cpu: "2"
              memory: "4Gi"
            requests:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8443
            initialDelaySeconds: 30
            periodSeconds: 10
