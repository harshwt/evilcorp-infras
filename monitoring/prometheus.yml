global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api:8443']
  - job_name: 'frontend'
    static_configs:
      - targets: ['web:443']
  - job_name: 'node-metrics'
    static_configs:
      - targets: ['localhost:9100']
